<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Katalog Produk - Mini Shopee</title>

    <link rel="stylesheet" href="catalog.css" />

    <script src="catalog.js" defer></script>
  </head>

  <body>
    <!-- NAVBAR -->
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand-mark">
          <span class="logo-badge">🛍️</span>
          Mini Shopee
        </div>

        <div class="search-wrap">
          <span class="icon">🔎</span>
          <input
            type="text"
            id="searchInput"
            placeholder="Cari produk atau kategori..."
          />
        </div>

        <div class="user-zone">
          <span class="greeting"
            >Halo, <strong id="userGreeting">Pengguna</strong></span
          >
          <!-- al: Info Keranjang & Tombol Logout -->
          <div class="cart-summary" style="font-size: 13px; font-weight: bold; color: var(--pink-3);">
            🛒 (<span id="cartCount">0</span>) | Rp <span id="cartTotal">0</span>
          </div>
          <button id="logoutBtn" class="btn-outline" style="padding: 6px 14px; font-size: 12px;">Logout</button>
        </div>
      </div>
    </header>

    <!-- TOOLBAR: FILTER & SORT -->
    <div class="toolbar">
      <div class="filters">
        <select id="categoryFilter">
          <option value="all">Semua Kategori</option>
        </select>

        <select id="sortFilter">
          <option value="default">Default</option>
          <option value="price-asc">Harga Termurah</option>
          <option value="price-desc">Harga Termahal</option>
          <option value="rating-desc">Rating Tertinggi</option>
        </select>
      </div>

      <div class="result-count" id="resultCount"></div>
    </div>

    <!-- KATALOG PRODUK -->
    <main class="container">
      <div id="productGrid" class="product-grid"></div>

      <div class="load-more-wrap" id="loadMoreWrap" style="display: none">
        <button class="btn-outline" id="loadMoreBtn">Muat Lebih Banyak</button>
      </div>
    </main>

    <!-- al: MODAL DETAIL PRODUK -->
    <div id="productModal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center;">
      <div class="modal-content" style="background: white; padding: 30px; border-radius: 20px; max-width: 500px; width: 90%; position: relative;">
        <button id="closeModalBtn" style="position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 20px; cursor: pointer;">✕</button>
        <div id="modalBody"></div>
      </div>
    </div>
  </body>
</html>
