<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="jadwal">
      <h2>Jadwal Kuliah</h2>
      <table>
        <tr>
          <th>Hari</th>
          <th>Mata Kuliah</th>
          <th>Jam</th>
          <th>Ruangan</th>
        </tr>
        <tr>
          <td>Senin</td>
          <td>Internet of Things</td>
          <td>07.00-09.30</td>
          <td>TW2-704</td>
        </tr>
        <tr>
          <td>Selasa</td>
          <td>Pemrograman Web</td>
          <td>07.00-09.30</td>
          <td>TW2-704</td>
        </tr>
        <tr>
          <td>Rabu</td>
          <td>Komunikasi Data dan Jarkom</td>
          <td>09.40-12.10</td>
          <td>TW2-704</td>
        </tr>
      </table>
    </div>

    <div class="hobi">
      <h2>Hobi</h2>
      <ul>
        <li>Tidur</li>
        <li>Nonton</li>
        <li>Kuliah</li>
      </ul>
    </div>

    <div class="form">
      <form action="/submit" method="POST">
        <fieldset>
          <legend>Hubungi Saya</legend>

          <label for="name">Nama</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="msukin nama"
            required
          />

          <br />
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="ex: 123@gmail.com"
            required
          />

          <br />
          <label for="password">Pesan</label>
          <input
            type="pesan"
            id="pesan"
            name="pesan"
            placeholder="ex: Selamat pagi"
            required
          />

          <br />
          <button type="submit">Kirim</button>
        </fieldset>
      </form>
    </div>
  </body>
</html>
